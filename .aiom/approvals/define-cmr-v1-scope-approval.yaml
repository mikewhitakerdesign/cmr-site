  Mailchimp/ConvertKit) plus static Instagram/Strava outbound links, with no
  payments, custom email sending, other third-party API calls, or Strava API
  integration. Does not cover any other Work Item, does not authorize
  deployment to Vercel, and does not authorize any external action beyond
  the bounded newsletter/social-link integration described above.
